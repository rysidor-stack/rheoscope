# dormant-register.yaml -- ships PRE-POPULATED (v3.0.26, plain-language sweep M4).
#
# The recorded-decision side of /doctor's sensor-reachability check (backlog v3.0-80).
# Every row below is a deploy/*.py the template itself ships without wiring an invoker:
# the engine's test battery and drills, run by hand during engine work, never by a
# skill. Before this file shipped, every fresh instance's very first /doctor run opened
# with a wall of UNACCOUNTED warnings about scripts the TEMPLATE author parked on
# purpose -- a disposition decision the operator was never equipped to make, fired at
# the person least able to answer it, on day one. The template author's answer is
# recorded here instead; the check now warns only about genuinely NEW orphans.
#
# THIS FILE IS A RECORD, NOT AN INVOCATION SURFACE: the reachability check explicitly
# excludes it when collecting surfaces. Rows whose script was deleted, or became
# reachable again, WARN as stale until removed -- if a later release wires one of
# these into a skill, delete its row in the same commit.
#
# Schema (flat, parsed by doctor.py's line regex -- PyYAML not required):
#   rows:
#     - script: <filename under deploy/>
#       reason: <why dormancy is intentional, one line>
#       decision-ref: <backlog entry / spec / decision record that made the call>

